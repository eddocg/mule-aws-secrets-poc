# ---------------------------------------------------------------------------
# mule-aws-secrets-poc - non-secret configuration
#
# Every value below is resolved from an environment variable that the runtime
# (later: the Kubernetes Deployment) provides. Nothing environment specific is
# hardcoded here and nothing secret is stored here.
#
# NOTE: there is intentionally NO db.user and NO db.password property.
# The database username and password live ONLY in AWS Secrets Manager and are
# retrieved by the aws-secretsmanager-jdbc driver at connection time.
# ---------------------------------------------------------------------------

http.port=${HTTP_PORT}

db.host=${DB_HOST}
db.port=${DB_PORT}
db.name=${DB_NAME}

# Secrets Manager secret id (NOT a credential). This is passed as the JDBC
# "user" so the AWS wrapper driver knows which secret to resolve.
aws.secret.id=${AWS_SECRET_ID}
